name: Test
on:
  - push
  - pull_request
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "2.1"
            ruby-version: "2.1"
            runs-on: "ubuntu-latest"
          # Disabled because ruby/setup-ruby doesn't work.
          # - name: "2.2"
          #   ruby-version: "2.2"
          #   runs-on: "ubuntu-latest"
          - name: "2.3"
            ruby-version: "2.3"
            runs-on: "ubuntu-latest"
          - name: "2.4"
            ruby-version: "2.4"
            runs-on: "ubuntu-latest"
          - name: "2.4 + frozen string literal"
            ruby-version: "2.4"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "2.5"
            ruby-version: "2.5"
            runs-on: "ubuntu-latest"
          # Disabled because RubyGems doesn't support frozen string literal.
          # - name: "2.5 + frozen string literal"
          #   ruby-version: "2.5"
          #   runs-on: "ubuntu-latest"
          #   rubyopt: "--enable-frozen-string-literal"
          - name: "2.6"
            ruby-version: "2.6"
            runs-on: "ubuntu-latest"
          - name: "2.6 + frozen string literal"
            ruby-version: "2.6"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "2.7"
            ruby-version: "2.7"
            runs-on: "ubuntu-latest"
          - name: "2.7 + frozen string literal"
            ruby-version: "2.7"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.0"
            ruby-version: "3.0"
            runs-on: "ubuntu-latest"
          - name: "3.0 + frozen string literal"
            ruby-version: "3.0"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.1"
            ruby-version: "3.1"
            runs-on: "ubuntu-latest"
          - name: "3.1 + frozen string literal"
            ruby-version: "3.1"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.1 on macOS"
            ruby-version: "3.1"
            runs-on: "macos-latest"
          - name: "3.1 on Windows"
            ruby-version: "3.1"
            runs-on: "windows-latest"
          - name: "3.2"
            ruby-version: "3.2"
            runs-on: "ubuntu-latest"
          - name: "3.2 + frozen string literal"
            ruby-version: "3.2"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.2 on macOS"
            ruby-version: "3.2"
            runs-on: "macos-latest"
          - name: "3.2 on Windows"
            ruby-version: "3.2"
            runs-on: "windows-latest"
          - name: "3.3"
            ruby-version: "3.3"
            runs-on: "ubuntu-latest"
          - name: "3.3 + frozen string literal"
            ruby-version: "3.3"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.3 on macOS"
            ruby-version: "3.3"
            runs-on: "macos-latest"
          - name: "3.3 on Windows"
            ruby-version: "3.3"
            runs-on: "windows-latest"
          - name: "3.4"
            ruby-version: "3.4"
            runs-on: "ubuntu-latest"
          - name: "3.4 + Thread"
            ruby-version: "3.4"
            runs-on: "ubuntu-latest"
            testopts: "--parallel=thread"
          - name: "3.4 + Process"
            ruby-version: "3.4"
            runs-on: "ubuntu-latest"
            testopts: "--parallel=process -Ilib"
          - name: "3.4 + frozen string literal"
            ruby-version: "3.4"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "3.4 on macOS"
            ruby-version: "3.4"
            runs-on: "macos-latest"
          - name: "3.4 on macOS + Thread"
            ruby-version: "3.4"
            runs-on: "macos-latest"
            testopts: "--parallel=thread"
          - name: "3.4 on macOS + Process"
            ruby-version: "3.4"
            runs-on: "macos-latest"
            testopts: "--parallel=process -Ilib"
          - name: "3.4 on Windows"
            ruby-version: "3.4"
            runs-on: "windows-latest"
          - name: "3.4 on Windows + Thread"
            ruby-version: "3.4"
            runs-on: "windows-latest"
            testopts: "--parallel=thread"
          - name: "3.4 on Windows + Process"
            ruby-version: "3.4"
            runs-on: "windows-latest"
            testopts: "--parallel=process -Ilib"
          - name: "head"
            ruby-version: "head"
            runs-on: "ubuntu-latest"
          - name: "head + frozen string literal"
            ruby-version: "head"
            runs-on: "ubuntu-latest"
            rubyopt: "--enable-frozen-string-literal"
          - name: "JRuby"
            ruby-version: "jruby"
            runs-on: "ubuntu-latest"
          - name: "JRuby - head"
            ruby-version: "jruby-head"
            runs-on: "ubuntu-latest"
          - name: "TruffleRuby"
            ruby-version: "truffleruby"
            runs-on: "ubuntu-latest"
          - name: "TruffleRuby - head"
            ruby-version: "truffleruby-head"
            runs-on: "ubuntu-latest"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - name: Install dependencies
        run: |
          bundle install
      - name: Test
        run: |
          bundle exec rake
        env:
          RUBYOPT: ${{ matrix.rubyopt }}
          TESTOPTS: ${{ matrix.testopts }}

  rbs-windows:
    name: RBS on Windows
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: test-unit
      - uses: actions/checkout@v6
        with:
          repository: ruby/rbs
          path: rbs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: mswin
      - name: Use test-unit
        working-directory: rbs
        shell: bash
        run: |
          ruby \
            -i.bak \
            -pe '$_.gsub!(/(gem "test-unit")/, "\\1, path: \"#{Dir.pwd}/../test-unit/\"")' \
            Gemfile
      - name: Install dependencies
        working-directory: rbs
        run: |
          bundle install --jobs 4 --retry 3
          bundle install --jobs 4 --retry 3 --gemfile=steep/Gemfile || echo "🚨 Failed to install Steep"

          bundle exec rake compile

          if (Get-Command re2c -ErrorAction SilentlyContinue) {
            Write-Host "🤖 Detected re2c"
          } else {
            Write-Host "🚨 Cannot find re2c, which is required to generate lexer. Install the tool to change the lexer."
          }
      - name: Test
        working-directory: rbs
        run: |
          bundle exec rake